name: Linting

on:
  push:
    branches-ignore: main

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
